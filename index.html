<!DOCTYPE html>

<style>
:root{--bg:#0A0F2C;--ink:#E9EBF7;--muted:#9AA1C9;--line:#2A336C;--accent:#B9C0F5;--chrome:linear-gradient(176deg,#FFFFFF 0%,#E4E9F8 34%,#8F9CCB 50%,#F4F6FC 66%,#B7C2E6 100%);color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(1.2px 1.2px at 8% 12%,#fff9,transparent 60%),radial-gradient(1px 1px at 23% 34%,#fff7,transparent 60%),
  radial-gradient(1.4px 1.4px at 41% 8%,#fffb,transparent 60%),radial-gradient(1px 1px at 72% 15%,#fff9,transparent 60%),
  radial-gradient(1px 1px at 88% 38%,#fff7,transparent 60%),radial-gradient(1.3px 1.3px at 33% 71%,#fff8,transparent 60%),
  radial-gradient(1px 1px at 67% 66%,#fff8,transparent 60%),radial-gradient(1px 1px at 84% 79%,#fff6,transparent 60%),
  radial-gradient(1px 1px at 6% 88%,#fff7,transparent 60%),radial-gradient(1.3px 1.3px at 46% 92%,#fff9,transparent 60%),
  radial-gradient(120% 70% at 50% 0%,#1B2360 0%,transparent 70%),linear-gradient(180deg,#0A0F2C 0%,#101646 55%,#1A1C52 100%)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
main{max-width:640px;margin:0 auto;padding:28px 18px 40px;text-align:center}
.logo{font-family:"DM Serif Display","Playfair Display",Georgia,serif;font-style:italic;font-size:clamp(56px,16vw,88px);line-height:1;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(120,150,255,.45));display:inline-block;padding:0 .12em;margin:0}
.tag{font-size:12px;letter-spacing:.32em;color:var(--muted);margin-top:6px}
.lead{margin:14px auto 0;font-size:15px;max-width:440px}
.poster{display:block;margin:26px auto 0;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.45);cursor:zoom-in;padding:0;background:none;width:100%}
.poster img{display:block;width:100%;height:auto}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.info{margin:26px auto 0;text-align:left;background:rgba(24,31,78,.6);border:1px solid var(--line);border-radius:18px;padding:6px 18px}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(42,51,108,.7);font-size:15px}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--muted);flex:none}
.row span:last-child{text-align:right}
.row a{color:var(--ink)}
.sns{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.sns a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);background:rgba(185,192,245,.1);border:1px solid #3A4380;border-radius:999px;padding:6px 16px 6px 6px;font-size:14px;font-weight:500}
.sns .ic{width:28px;height:28px;border-radius:50%;background:#fff;color:#0A0F2C;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 18px 30px}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(5,8,28,.94);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 50px) 10px 20px;overflow:auto}
.zoom[hidden]{display:none}
.zoom img{max-width:100%;max-height:100%;border-radius:10px}
.zoom button{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:24px;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1 class="logo">ORBITte</h1>
  <div class="tag">LIVE IDOL GROUP</div>
  <p class="lead">자체 프로듀싱 악곡파 라이브 아이돌 오르비테(ORBITte)에서 마지막 멤버를 찾습니다.</p>

  <button class="poster" id="poster" type="button" aria-label="멤버 모집 포스터 크게 보기">
    <img src="recruit.jpg" alt="ORBITte NEW MEMBER recruitment. 자체 프로듀싱 악곡파 라이브 아이돌 오르비테에서 마지막 멤버를 찾습니다. 모집 대상: 03년생 이전 출생자(24세 이상), 3~4월 오히로메가 가능하신 분, 금전적인 여유가 되시는 분, 주 3회 이상의 라이브 및 서울 내 연습 참여가 가능하신 분, 그룹 내 프로듀싱 방침에 성실히 따라주실 분, 책임감이 강한 분(1년 이상 활동). 우대 사항: 노래에 자신 있으신 분. 지원 양식: 얼굴 사진, 자기소개와 생년월일, 키, 거주 지역(구까지), 보컬과 댄스 영상 자유곡 각 1절씩을 첨부하여 오르비테 공식 이메일 ORBITte.OFCL@gmail.com 로 접수 부탁드립니다.">
  </button>

  <div class="sns">
    <a href="https://x.com/ORBITte_OFCL" target="_blank" rel="noopener noreferrer"><span class="ic">𝕏</span>@ORBITte_OFCL</a>
    <a href="https://www.youtube.com/@ORBITte_OFCL" target="_blank" rel="noopener noreferrer"><span class="ic">▶</span>YouTube</a>
  </div>
</main>
<footer>© 2026 ORBITte. All rights reserved.</footer>

<div class="zoom" id="zoom" hidden role="dialog" aria-modal="true" aria-label="포스터 크게 보기"><button type="button" id="zoomClose" aria-label="닫기">×</button><img src="recruit.jpg" alt=""></div>
<script>
const z = document.getElementById("zoom");
document.getElementById("poster").onclick = () => { z.hidden = false; document.body.style.overflow = "hidden"; document.getElementById("zoomClose").focus(); };
const close = () => { z.hidden = true; document.body.style.overflow = ""; };
document.getElementById("zoomClose").onclick = close;
z.addEventListener("click", e => { if (e.target === z) close(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !z.hidden) close(); });
</script>
</body>
</html>
